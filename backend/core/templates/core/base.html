<!DOCTYPE html>
<html lang="en" class="h-full bg-[#050507] text-zinc-100 scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GitPulse &bull; Micro-Bounties for Engineering Teams{% endblock %}</title>

    <!-- Google Fonts: Inter & Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              obsidian: '#050507',
              zinc: {
                950: '#09090b',
                900: '#121215',
                850: '#18181c',
                800: '#222227',
                700: '#32323a',
                600: '#52525b',
                500: '#71717a',
                400: '#a1a1aa',
                300: '#d4d4d8',
                200: '#e4e4e7',
                100: '#f4f4f5',
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            animation: {
              'marquee': 'marquee 28s linear infinite',
              'shimmer': 'shimmer 2.5s infinite',
              'float-slow': 'floatSlow 14s ease-in-out infinite alternate',
              'float-reverse': 'floatReverse 18s ease-in-out infinite alternate',
              'pulse-glow': 'pulseGlow 4s ease-in-out infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              shimmer: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(200%)' },
              },
              floatSlow: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '100%': { transform: 'translate(40px, 30px) scale(1.08)' },
              },
              floatReverse: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '100%': { transform: 'translate(-35px, -25px) scale(1.05)' },
              },
              pulseGlow: {
                '0%, 100%': { opacity: '0.12' },
                '50%': { opacity: '0.22' },
              }
            }
          }
        }
      }
    </script>

    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      /* Smooth GPU-accelerated reveal transitions */
      .reveal {
        opacity: 0;
        transform: translateY(24px);
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      .reveal.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Bento card spotlight mouse-tracking border */
      .bento-card {
        position: relative;
        overflow: hidden;
      }
      .bento-card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: radial-gradient(400px circle at var(--mouse-x, 0) var(--mouse-y, 0), rgba(255, 255, 255, 0.22), transparent 45%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .bento-card:hover::before {
        opacity: 1;
      }

      /* Glass panel highlights */
      .glass-surface {
        background: rgba(255, 255, 255, 0.025);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.08), 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      }

      /* Perspective tilt preview container */
      .perspective-container {
        perspective: 1200px;
      }
      .tilt-card {
        transform-style: preserve-3d;
        transition: transform 0.15s ease-out;
      }

      /* Edge mask for infinite marquee */
      .marquee-fade {
        mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
      }

      /* Respect reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .reveal {
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
        }
        .tilt-card {
          transform: none !important;
        }
        .animate-marquee {
          animation: none !important;
        }
      }
    </style>
</head>
<body class="min-h-full flex flex-col font-sans bg-[#050507] text-zinc-100 antialiased selection:bg-indigo-500 selection:text-white relative overflow-x-hidden">

    <!-- Ambient Gradient Blobs (Slow GPU Drifting) -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[720px] h-[480px] bg-indigo-600/12 rounded-full blur-[140px] animate-float-slow"></div>
        <div class="absolute top-[28%] -left-48 w-[500px] h-[400px] bg-emerald-600/8 rounded-full blur-[130px] animate-float-reverse"></div>
        <div class="absolute top-[45%] -right-48 w-[550px] h-[420px] bg-cyan-600/8 rounded-full blur-[140px] animate-float-slow"></div>
    </div>

    <!-- 1. Floating Frosted-Glass Navbar (Sticky) -->
    <header class="sticky top-0 z-50 px-4 sm:px-6 py-4 pointer-events-none">
        <div class="max-w-6xl mx-auto pointer-events-auto">
            <div class="h-14 px-4 sm:px-6 rounded-full glass-surface flex items-center justify-between transition-all duration-300">
                <!-- Left: Minimalist Logo + Wordmark -->
                <a href="{% url 'home' %}" class="flex items-center space-x-2.5 group">
                    <div class="w-7 h-7 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-zinc-200 group-hover:border-white/25 transition-colors duration-200">
                        <i data-lucide="terminal" class="w-3.5 h-3.5 text-indigo-400"></i>
                    </div>
                    <span class="text-sm font-bold tracking-tight text-white group-hover:text-indigo-200 transition-colors duration-200">GitPulse</span>
                </a>

                <!-- Center: Smooth Anchor Links -->
                <nav class="hidden md:flex items-center space-x-7 text-xs font-medium text-zinc-400">
                    <a href="#product" class="hover:text-white transition-colors duration-200">Product</a>
                    <a href="#workflow" class="hover:text-white transition-colors duration-200">Workflow</a>
                    <a href="#architecture" class="hover:text-white transition-colors duration-200">Architecture</a>
                    <a href="/api/docs/" target="_blank" class="hover:text-white transition-colors duration-200 flex items-center gap-1 font-mono text-[11px]">
                        API Docs <i data-lucide="external-link" class="w-3 h-3 text-zinc-500"></i>
                    </a>
                </nav>

                <!-- Right: Unified React SPA Auth Controls -->
                <div class="flex items-center space-x-2.5 text-xs">
                    <a href="http://localhost:5173/?mode=login" class="px-3 py-1.5 rounded-full text-zinc-300 hover:text-white transition-colors duration-200 font-medium">
                        Log in
                    </a>
                    <a href="http://localhost:5173/?mode=register" class="px-4 py-1.5 rounded-full bg-white hover:bg-zinc-200 text-zinc-950 font-semibold transition-all duration-200 shadow-sm flex items-center gap-1.5">
                        Get started
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow z-10">
        {% block content %}{% endblock %}
    </main>

    <!-- Minimalist Footer -->
    <footer class="border-t border-white/5 bg-[#050507] py-10 px-6 text-xs text-zinc-500 font-mono z-10">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2 text-zinc-400 font-sans">
                <span class="font-semibold text-zinc-200">GitPulse</span>
                <span>&copy; 2026</span>
                <span class="text-zinc-600">&bull;</span>
                <span class="text-zinc-500 text-[11px] font-mono">Micro-Bounties for Developer Teams</span>
            </div>
            <div class="flex items-center gap-6 text-zinc-400 font-mono text-[11px]">
                <a href="/api/docs/" target="_blank" class="hover:text-zinc-200 transition-colors duration-200">OpenAPI Spec</a>
                <a href="/admin/" target="_blank" class="hover:text-zinc-200 transition-colors duration-200">Django Admin</a>
                <a href="https://github.com" target="_blank" class="hover:text-zinc-200 transition-colors duration-200">GitHub</a>
            </div>
        </div>
    </footer>

    <!-- Vanilla JS: Lucide + Scroll Reveal + Mouse Spotlight -->
    <script>
      // 1. Initialize Lucide Icons
      lucide.createIcons();

      // 2. High-performance Scroll Reveal via IntersectionObserver
      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

      document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

      // 3. Bento Card Mouse-tracking Spotlight Effect
      document.querySelectorAll('.bento-card').forEach(card => {
        card.addEventListener('pointermove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          card.style.setProperty('--mouse-x', `${x}px`);
          card.style.setProperty('--mouse-y', `${y}px`);
        });
      });

      // 4. Subtle 3D Perspective Tilt on MouseMove for Hero Preview Card
      const tiltContainer = document.querySelector('.perspective-container');
      const tiltCard = document.querySelector('.tilt-card');
      if (tiltContainer && tiltCard) {
        tiltContainer.addEventListener('pointermove', (e) => {
          const rect = tiltContainer.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          const rotateX = ((y - centerY) / centerY) * -3.5;
          const rotateY = ((x - centerX) / centerX) * 3.5;
          tiltCard.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
        });

        tiltContainer.addEventListener('pointerleave', () => {
          tiltCard.style.transform = 'rotateX(0deg) rotateY(0deg)';
        });
      }
    </script>
</body>
</html>
